<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rooktide: Glass Current</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main id="game-shell" aria-label="Rooktide Glass Current open-world game">
  <canvas id="game" aria-label="Rooktide coastal city gameplay"></canvas>
  <section id="hud" aria-live="polite">
    <div id="mission-card"></div><div id="status-card"></div><div id="dispatch"></div>
    <div id="dialogue"></div><div id="equipment"></div><div id="minimap-wrap"><canvas id="minimap" width="220" height="220"></canvas><span id="district"></span></div>
    <div id="vehicle-card"></div><div id="toast"></div>
  </section>
  <section id="menu" class="hidden"></section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
